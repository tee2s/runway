[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simctl"
version = "0.1.0"
description = "CLI for AWS robotics simulation lifecycle"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.34",
  "PyYAML>=6.0"
]

[project.scripts]
sim = "simctl.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
